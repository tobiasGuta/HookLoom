name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Go 1.23 is no longer security-supported. Keep the module's old
          # language baseline but test and build with a patched toolchain.
          go-version: '1.27.3'
          cache: false
      - name: Format check
        run: |
          test -z "$(gofmt -l main.go main_test.go)"
      - name: Go vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Dashboard JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/rule_conflicts.js
      - name: Rule-conflict regression tests
        run: node --test tests/rule_conflicts.test.cjs
      - name: Build
        run: go build ./...
